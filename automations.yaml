    entity_id:
    - switch.tapparella_bonsai_b
    - switch.tapparella_sala_b
    - switch.tapparella_studioigor_b
  - delay: 7
  - service: switch.toggle
    entity_id:
    - switch.tapparella_bonsai_b
    - switch.tapparella_sala_b
    - switch.tapparella_studioigor_b
