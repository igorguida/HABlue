    max_temp: 23
    target_temp: 20
    cold_tolerance: 0.3
    hot_tolerance: 0
    min_cycle_duration:
      seconds: 5
    keep_alive:
      minutes: 3

  - platform: generic_thermostat
    name: design
    heater: switch.zona_riscaldamento_sala
    target_sensor: sensor.temperature_design
    min_temp: 15
    max_temp: 22
    target_temp: 19
    cold_tolerance: 0.3
    hot_tolerance: 0
    min_cycle_duration:
      seconds: 5
    keep_alive:
      minutes: 3

  - platform: generic_thermostat
    name: pianoterra
    heater: switch.zona_riscaldamento_p0
    target_sensor: sensor.temperature_pianoterra
    min_temp: 15
    max_temp: 21
    target_temp: 19
    cold_tolerance: 0.3
    hot_tolerance: 0
    min_cycle_duration:
      seconds: 5
    keep_alive:
      minutes: 3

  - platform: generic_thermostat
    name: primopiano
    heater: switch.zona_riscaldamento_p1
    target_sensor: sensor.temperature_primopiano
    min_temp: 15
    max_temp: 21
    target_temp: 19
    cold_tolerance: 0.3
    hot_tolerance: 0
    min_cycle_duration:
      seconds: 5
    keep_alive:
      minutes: 3


